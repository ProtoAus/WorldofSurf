<style>
  /* P1820: the site's look (src/release/site/site.css) -- same palette, header and pill buttons. The admin CSP
     loads no fonts or images, so the wordmark is inline SVG (_admin_brand.html) and type is the system stack. */
  :root { color-scheme: dark;
    --bg:#000; --card:#111116; --card-2:#1a1a20; --hover:#1f1f26; --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.16); --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#6e6e73;
    --accent:#59bfff; --accent-2:#8fd4ff; --on-accent:#00131f;
    --good:#6edc82; --warn:#f0d25a; --bad:#ff7a70;
    --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto,
           "Helvetica Neue", Arial, sans-serif;
    --mono:ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--sans); letter-spacing:-.005em;
         -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { color:var(--accent-2); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ---- header: the site's ---- */
  body > header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:22px; flex-wrap:wrap;
         padding:0 22px; min-height:56px; background:rgba(0,0,0,.78); border-bottom:1px solid var(--line);
         -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); }
  header .brand { display:flex; align-items:center; gap:10px; color:var(--text); flex:none; }
  header .wordmark { height:34px; width:auto; display:block; }
  header .tag { font:600 10px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--text-2);
         border:1px solid var(--line-2); border-radius:980px; padding:4px 8px; }
  header .spacer { flex:1; }
  nav.nav { display:flex; gap:20px; overflow-x:auto; scrollbar-width:none; }
  nav.nav a { color:var(--text-2); font-size:13px; white-space:nowrap; padding:17px 0 15px;
         border-bottom:2px solid transparent; }
  nav.nav a:hover { color:var(--text); }
  nav.nav a[aria-current=page] { color:var(--text); border-bottom-color:var(--accent); }
  nav.nav a.site-link { color:var(--text-3); }
  header form button { background:transparent; color:var(--text-2); box-shadow:inset 0 0 0 1px var(--line-2); border:0; }
  header form button:hover { color:var(--text); background:transparent; box-shadow:inset 0 0 0 1px var(--text-2); }

  /* ---- layout ---- */
  main { padding:28px 22px 64px; max-width:1400px; margin:0 auto; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(min(23rem, 100%), 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; }
  .stack > * + * { margin-top:16px; }
  .card h2 { margin:0 0 4px; font-size:17px; font-weight:700; letter-spacing:-.02em; display:flex;
         align-items:center; gap:8px; flex-wrap:wrap; }
  .lead { color:var(--text-2); font-size:13.5px; margin:2px 0 10px; max-width:80ch; }
  /* A collapsed card still has to say whether it matters, so the summary carries state pills; .sum is their row. */
  details.card > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
         flex-wrap:wrap; font-size:15px; font-weight:650; }
  details.card > summary::-webkit-details-marker { display:none; }
  details.card > summary::before { content:""; flex:none; width:6px; height:6px; border-right:2px solid var(--text-2);
         border-bottom:2px solid var(--text-2); transform:rotate(-45deg); transition:transform .15s; }
  details.card[open] > summary::before { transform:rotate(45deg); }
  details.card:not([open]) { padding:11px 20px; }
  details.card[open] > summary { padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .sum { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-weight:400; font-size:12.5px; color:var(--text-2); }
  .muted { color:var(--text-2); font-size:12.5px; }

  /* ---- badges ---- */
  .pill { display:inline-block; font:650 10.5px/1.5 var(--sans); padding:1px 8px; border-radius:980px;
          border:1px solid var(--line-2); color:var(--text-2); letter-spacing:.04em; text-transform:uppercase;
          white-space:nowrap; vertical-align:1px; }
  .pill.up { background:rgba(110,220,130,.12); border-color:rgba(110,220,130,.45); color:var(--good); }
  .pill.down { background:rgba(255,122,112,.12); border-color:rgba(255,122,112,.45); color:var(--bad); }
  .pill.warn { background:rgba(240,210,90,.12); border-color:rgba(240,210,90,.45); color:var(--warn); }
  .pill.info { background:rgba(89,191,255,.12); border-color:rgba(89,191,255,.45); color:var(--accent); }
  .pill.grey { background:rgba(255,255,255,.04); color:var(--text-2); }
  [data-tip] { cursor:help; }
  a[data-tip], button[data-tip], tr.link [data-tip] { cursor:inherit; }
  .why { color:var(--text-2); font-size:12.5px; white-space:nowrap; }
  .why.look1 { color:var(--warn); }
  .why.look2 { color:var(--bad); }

  /* ---- tables, lists ---- */
  dl { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin:10px 0; font-size:13px; }
  dt { color:var(--text-2); } dd { margin:0; min-width:0; overflow-wrap:anywhere; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--text-3); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .scroll { overflow-x:auto; }
  tr.link { cursor:pointer; }
  tr.link:hover td { background:var(--hover); }
  tr.stale td { color:var(--text-3); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }

  /* ---- controls ---- */
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=number], input[type=search], input[type=password], select { flex:1; min-width:0; padding:8px 12px;
        background:var(--card-2); border:1px solid var(--line); border-radius:10px; color:var(--text);
        font:13.5px var(--sans); }
  select { flex:0 1 auto; }
  input[type=range] { flex:1 1 10rem; min-width:6rem; accent-color:var(--accent); }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:0; }
  button, a.button { padding:6px 14px; border:1px solid var(--line-2); border-radius:980px; background:var(--card-2);
        color:var(--text); font:600 12.5px var(--sans); cursor:pointer; white-space:nowrap; display:inline-block; }
  button:hover, a.button:hover { background:var(--hover); border-color:var(--text-3); color:var(--text); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  button.primary:hover { background:var(--accent-2); border-color:var(--accent-2); }
  button.danger { background:rgba(255,122,112,.14); border-color:rgba(255,122,112,.5); color:#ffb4ad; }
  button.danger:hover { background:rgba(255,122,112,.24); }
  .tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .tabs button { font-weight:500; color:var(--text-2); }
  .tabs button b { color:var(--text); font-weight:650; margin-left:4px; font-variant-numeric:tabular-nums; }
  .tabs button.primary { background:rgba(89,191,255,.16); border-color:var(--accent); color:var(--text); }
  .tabs button.primary b { color:var(--accent-2); }
  h3 { margin:18px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-3); }
  pre { margin:0; padding:12px; background:#0a0a0d; border:1px solid var(--line); border-radius:10px; overflow:auto;
        max-height:22rem; font:12px/1.5 var(--mono); white-space:pre-wrap; word-break:break-word; }
  .mono, code { font-family:var(--mono); font-size:12.5px; }
  .reason { white-space:pre-wrap; word-break:break-word; }
  td.reason { min-width:16rem; }
  .nowrap { white-space:nowrap; }
  canvas { display:block; width:100%; background:#0a0a0d; border:1px solid var(--line); border-radius:10px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-size:12px; color:var(--text-2); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .kv { display:inline-block; margin:0 5px 4px 0; padding:1px 7px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
  .kv.hot { border-color:rgba(89,191,255,.5); color:var(--accent); }
  .toast { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:6px; z-index:30; }
  .toast div { padding:9px 14px; border-radius:12px; font-size:13px; max-width:26rem; }
  .toast .ok { background:#0f2416; border:1px solid rgba(110,220,130,.45); color:#a8ecc0; }
  .toast .bad { background:#2a1210; border:1px solid rgba(255,122,112,.5); color:#ffb4ad; }
  .note { font-size:12.5px; color:var(--text-2); margin:8px 0 0; }
  .note.bad { color:#ffb4ad; }
  .empty { color:var(--text-3); font-size:13px; padding:10px 0; }
  .loading { opacity:.55; transition:opacity .12s; }
  .explain { margin:10px 0 0; padding:12px 14px; border-radius:12px; background:var(--card-2); border:1px solid var(--line); }
  .explain b { display:block; font-size:14px; margin-bottom:2px; }
  .explain.look1 { border-color:rgba(240,210,90,.45); }
  .explain.look2 { border-color:rgba(255,122,112,.5); }
  .explain p { margin:0; color:var(--text-2); font-size:13px; }
  .explain .raw { margin-top:6px; color:var(--text-3); font:12px var(--mono); overflow-wrap:anywhere; }

  /* ---- the shared tooltip (any element with data-tip) ---- */
  #tip { position:fixed; z-index:40; max-width:340px; padding:9px 12px; border-radius:10px; pointer-events:none;
         background:#1c1c23; border:1px solid var(--line-2); box-shadow:0 10px 30px rgba(0,0,0,.6);
         color:var(--text); font:13px/1.45 var(--sans); white-space:pre-line; opacity:0; transition:opacity .08s; }
  #tip.on { opacity:1; }
  @media (max-width:720px) { body > header { gap:12px; padding:0 14px; } nav.nav { gap:14px; order:3; width:100%; }
    main { padding:18px 14px 48px; } }
</style>
<script>
"use strict";
// P1820: one tooltip for every admin page: hover or focus anything with data-tip.
(function () {
  let tip = null, owner = null;
  function show(el) {
    if (!tip) { tip = document.createElement("div"); tip.id = "tip"; tip.setAttribute("role", "tooltip"); document.body.appendChild(tip); }
    owner = el;
    tip.textContent = el.dataset.tip;
    tip.classList.add("on");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    let y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = r.top - h - 8;
    tip.style.left = x + "px"; tip.style.top = Math.max(8, y) + "px";
  }
  function hide() { if (tip) tip.classList.remove("on"); owner = null; }
  function find(t) { return t instanceof Element ? t.closest("[data-tip]") : null; }
  document.addEventListener("mouseover", e => { const el = find(e.target); if (el && el !== owner) show(el); else if (!el) hide(); });
  document.addEventListener("focusin", e => { const el = find(e.target); if (el) show(el); });
  document.addEventListener("focusout", hide);
  document.addEventListener("scroll", hide, true);
})();
</script>

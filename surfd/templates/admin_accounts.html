<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Accounts · World of Surf admin</title>
{% include "_admin_style.html" %}
<style>
  #kit-dialog { color:var(--text); width:min(30rem, calc(100% - 2rem)); }
  #kit-dialog::backdrop { background:rgba(0,0,0,.72); }
  #kit-choice { display:block; width:100%; margin-top:.35rem; }
  #kit-hint { min-height:2.8em; }
  .kit-cell { min-width:10rem; }
</style>
</head>
<body>
<header>
  <!-- sitenav:admin page=accounts -->
  <a class="brand" href="/admin/" aria-label="World of Surf admin">{% include "_admin_brand.html" %}<span class="tag">Admin</span></a>
  <nav class="nav" aria-label="Admin"><a href="/admin/">Fleet</a><a href="/admin/maps">Maps</a><a href="/admin/runs">Runs</a><a href="/admin/top10">Top 10</a><a href="/admin/accounts" aria-current="page">Accounts</a><a href="/admin/reports">Reports</a><a class="site-link" href="https://proto.bar/worldofsurf/">Site &#8599;</a></nav>
  <!-- /sitenav -->
  <span class="spacer"></span>
  <form method="post" action="/admin/logout" style="margin:0">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Sign out</button>
  </form>
</header>

<main>
  <div class="card">
    <h2>Ban a Steam account</h2>
    <p class="note" id="mode"></p>
    <div class="row" style="margin-bottom:.6rem">
      <input type="text" id="sid" placeholder="SteamID64 (17 digits)" maxlength="24"
             inputmode="numeric" spellcheck="false" autocomplete="off">
      <input type="text" id="note" placeholder="why (kept with the ban)" maxlength="200"
             spellcheck="false" autocomplete="off" style="flex:1">
      <button id="ban" class="primary">Ban</button>
    </div>
  </div>
  <div class="card">
    <h2>Accounts <span class="muted" style="font-weight:400" id="summary"></span></h2>
    <div class="scroll">
      <table id="accounts"><thead><tr>
        <th>name</th><th>SteamID</th><th class="num">installs</th>
        <th class="num">rows shown</th><th class="num">rows hidden</th>
        <th>last seen</th><th>state</th><th>note</th><th>Inventory / badges</th><th></th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>

<dialog class="card" id="kit-dialog" aria-labelledby="kit-title">
  <h2 id="kit-title">Manage inventory / badges</h2>
  <p class="lead" id="kit-account"></p>
  <form id="kit-form">
    <label for="kit-choice">Choose a change</label>
    <select id="kit-choice" aria-describedby="kit-hint" autofocus required></select>
    <p class="note" id="kit-hint" aria-live="polite"></p>
    <div class="row">
      <button type="submit" id="kit-apply" class="primary" disabled>Apply change</button>
      <button type="button" id="kit-cancel">Cancel</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const CSRF = {{ csrf | tojson }};
const BADGES = {{ badges | tojson }};
const ITEMS = {{ items | tojson }};
const kitDialog = document.getElementById("kit-dialog");
const kitChoice = document.getElementById("kit-choice");
const kitHint = document.getElementById("kit-hint");
const kitApply = document.getElementById("kit-apply");
let kitAccount, kitActions;

function badgeMask(c) { return c.roles | (c.badges || 0); }
function showKitAction() {
  const action = kitActions[kitChoice.value];
  kitApply.disabled = !action;
  kitApply.textContent = action ? action.label : "Apply change";
  kitHint.textContent = action ? action.hint : "Select a badge or item to see what the change does.";
}
function openKit(a, c) {
  kitAccount = a;
  kitActions = [];
  document.getElementById("kit-account").textContent = (a.name || "(unnamed account)") + " · " + a.steamid;
  const placeholder = el("option", "", "Select a badge or item…");
  placeholder.disabled = true;
  placeholder.value = "";
  kitChoice.replaceChildren(placeholder);
  const mask = badgeMask(c);
  for (const [label, catalog, has, add, remove, verb, undo] of [
    ["Badges", BADGES, entry => !!(mask & entry.bit), "add-role", "remove-role", "Add", "Remove"],
    ["Items", ITEMS, entry => c.items.some(i => i.id === entry.id), "grant", "revoke", "Give", "Revoke"]
  ]) {
    const group = el("optgroup");
    group.label = label;
    for (const entry of catalog) {
      const owned = has(entry), actionLabel = (owned ? undo : verb) + " " + entry.name;
      const option = el("option", "", actionLabel);
      option.value = String(kitActions.length);
      kitActions.push({op: owned ? remove : add, id: entry.id, label: actionLabel, hint: entry.hint});
      group.appendChild(option);
    }
    kitChoice.appendChild(group);
  }
  kitChoice.value = "";
  showKitAction();
  kitDialog.showModal();
}
kitChoice.addEventListener("change", showKitAction);
document.getElementById("kit-cancel").addEventListener("click", () => kitDialog.close());
document.getElementById("kit-form").addEventListener("submit", ev => {
  ev.preventDefault();
  const action = kitActions[kitChoice.value];
  if (!action || busy) return;
  const sid = kitAccount.steamid;
  if (action.id === "mapper-admin" && !confirm(action.label + " for " + sid + "? " + action.hint)) return;
  kitDialog.close();
  void post({steamid: sid, action: action.op, value: action.id}, "inventory").then(() => {
    document.querySelector(`.kit-cell button[data-sid="${CSS.escape(sid)}"]`)?.focus();
  });
});

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text);
  return e;
}
function pill(word, cls) { return el("span", "pill " + (cls || ""), word); }
function toast(msg, ok) {
  const d = el("div", ok ? "ok" : "bad", msg);
  document.getElementById("toast").appendChild(d);
  setTimeout(() => d.remove(), ok ? 4000 : 9000);
}
function fmtDate(t) {
  return t > 0 ? new Date(t * 1000).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "-";
}

// ONE ACTION AT A TIME, AND THE LIST IS REDRAWN BEFORE THE NEXT.  The list
// re-sorts after a ban, so a second click lands on another account's button:
// every button is dead from the click until the new list is drawn, the note
// is spent by the action that used it, and a row's button sends the state the
// page showed (`seen`), which surfd refuses if it is no longer true.
let busy = false;
function lock(on) {
  busy = on;
  for (const b of document.querySelectorAll("button[data-sid], #ban")) b.disabled = on;
}
async function post(fields, endpoint = "ban") {
  if (busy) return false;
  lock(true);
  const body = new URLSearchParams(Object.assign({csrf: CSRF}, fields));
  let r, j, ok = false;
  try {
    r = await fetch("/admin/api/" + endpoint, {method: "POST", body, credentials: "same-origin"});
    if (r.status === 401) { location.href = "/admin/login"; return false; }
    j = await r.json();
    ok = !!j.ok;
    toast(ok ? (j.message || "done") : (j.error || "failed"), ok);
  } catch (e) { toast("could not reach surfd: " + e.message, false); }
  if (ok && endpoint === "ban") {
    document.getElementById("sid").value = "";
    document.getElementById("note").value = "";
  }
  await load();
  lock(false);
  return ok;
}

function accountRow(a) {
  const tr = el("tr");
  const state = el("td");
  state.appendChild(a.banned ? pill("banned " + fmtDate(a.banned), "down") : pill("ok", "up"));
  const act = el("td"), b = el("button", "", a.banned ? "Unban" : "Ban");
  b.dataset.sid = a.steamid;
  b.dataset.action = a.banned ? "unban" : "ban";
  b.dataset.seen = String(a.banned);
  b.dataset.name = a.name || "(never signed in)";
  act.appendChild(b);
  const kit = el("td", "kit-cell"), c = a.cosmetics || {roles: 0, items: []};
  const mask = badgeMask(c);
  if (mask & 1) {
    const names = ["Tester", ...BADGES.filter(entry => mask & entry.bit).map(entry => entry.name)];
    const summary = el("div", "muted", names.length + (names.length === 1 ? " badge" : " badges") +
      " · " + c.items.length + (c.items.length === 1 ? " item" : " items"));
    summary.title = names.join(", ");
    const manage = el("button", "", "Manage…");
    manage.dataset.sid = a.steamid;
    manage.setAttribute("aria-label", "Manage inventory and badges for " + (a.name || a.steamid));
    manage.addEventListener("click", () => { if (!busy) openKit(a, c); });
    kit.append(summary, manage);
  } else {
    kit.appendChild(el("span", "muted", a.banned ? "Unavailable while banned" : "Not linked"));
  }
  tr.append(el("td", "", a.name || "(never signed in)"), el("td", "mono", a.steamid),
            el("td", "num mono", a.installs), el("td", "num mono", a.shown),
            el("td", "num mono", a.hidden), el("td", "", fmtDate(a.seen)), state,
            el("td", "", a.note), kit, act);
  return tr;
}

async function load() {
  let r, j;
  try {
    r = await fetch("/admin/api/accounts", {credentials: "same-origin"});
    if (r.status === 401) { location.href = "/admin/login"; return; }
    j = await r.json();
  } catch (e) { toast("could not load accounts: " + e.message, false); return; }
  if (!j.ok) { toast(j.error || "failed", false); return; }
  const tb = document.querySelector("#accounts tbody");
  tb.replaceChildren();
  for (const a of j.accounts) tb.appendChild(accountRow(a));
  if (!tb.children.length) {
    const tr = el("tr"), td = el("td", "empty", "nobody has signed in through Steam yet");
    td.colSpan = 10; tr.appendChild(td); tb.appendChild(tr);
  }
  const banned = j.accounts.filter(a => a.banned).length;
  document.getElementById("summary").textContent =
    "— " + j.accounts.length + " accounts, " + banned + " banned";
  const m = document.getElementById("mode");
  m.className = j.ranked_linked ? "note" : "note bad";
  m.textContent = j.ranked_linked
    ? "A banned account's rows leave every board (kept, and back on an unban), its runs are not stored, and its installs are told when they connect."
    : "Ranked times do not need a linked account yet (SURFD_RANKED_LINKED=0): a ban is told to the account's installs and stops it linking, but its runs are still stored, under the install's own id.";
}

document.getElementById("ban").addEventListener("click", () => {
  const sid = document.getElementById("sid").value.trim();
  const note = document.getElementById("note").value.trim();
  post({steamid: sid, action: "ban", note});
});
// A row's Ban only FILLS the form above (the reason is typed for that account,
// and the Ban that sends it is the one beside the reason).  A row's Unban asks
// first, by name.
document.querySelector("#accounts tbody").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-sid]");
  if (!b || busy || !b.dataset.action) return;
  if (b.dataset.action === "ban") {
    document.getElementById("sid").value = b.dataset.sid;
    document.getElementById("note").value = "";
    document.getElementById("note").focus();
    return;
  }
  if (!confirm("Unban " + b.dataset.name + " (" + b.dataset.sid + ")? Its rows go back on the boards."))
    return;
  post({steamid: b.dataset.sid, action: "unban", seen: b.dataset.seen,
        note: document.getElementById("note").value.trim()});
});

load();
</script>
</body>
</html>

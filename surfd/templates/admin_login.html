<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · World of Surf admin</title>
{% include "_admin_style.html" %}
<style>
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
         background:radial-gradient(60rem 30rem at 50% -10%, rgba(89,191,255,.10), transparent 70%), var(--bg); }
  .brand { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; color:var(--text); }
  .brand .wordmark { height:64px; width:auto; }
  .brand .tag { font:600 10px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--text-2);
         border:1px solid var(--line-2); border-radius:980px; padding:4px 8px; }
  form { width:min(92vw, 23rem); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px; }
  h1 { margin:0 0 4px; font-size:20px; letter-spacing:-.02em; }
  p.sub { margin:0 0 18px; color:var(--text-2); font-size:13.5px; }
  label { display:block; margin-bottom:6px; font-size:12.5px; color:var(--text-2); }
  input[type=password] { width:100%; padding:11px 14px; font-size:15px; }
  form button { margin-top:16px; width:100%; padding:11px; font-size:14px; }
  .err, .lock { margin-top:14px; padding:9px 12px; border-radius:12px; font-size:13px; }
  .err { background:#2a1210; border:1px solid rgba(255,122,112,.5); color:#ffb4ad; }
  .lock { background:#2a2410; border:1px solid rgba(240,210,90,.45); color:#f5df8a; }
  .back { margin-top:18px; font-size:13px; color:var(--text-2); }
</style>
</head>
<body>
<a class="brand" href="https://proto.bar/worldofsurf/" aria-label="World of Surf">{% include "_admin_brand.html" %}<span class="tag">Admin</span></a>
<form method="post" action="/admin/login" autocomplete="off">
  <h1>Sign in</h1>
  <p class="sub">Servers, runs, reports and maps for World of Surf.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="pw">Password</label>
  <input id="pw" type="password" name="password" autocomplete="current-password"
         autofocus required>
  <button class="primary" type="submit">Sign in</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  {% if lockout %}
    <div class="lock">Locked out for about {{ (lockout // 60) + 1 }} more minute(s).</div>
  {% endif %}
</form>
<a class="back" href="https://proto.bar/worldofsurf/">&larr; Back to the site</a>
</body>
</html>

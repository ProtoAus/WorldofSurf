// Run on a map with func_smokevolume, at a fixed view, with console logging on.
// Produces complete reference/cache/PVS tables for tools/p1830_smokevol_check.py.
// Inspect nonzero particles/volumes and an actually culled/visible control;
// an empty map or disabled native PVS is not an acted visibility test.
cfg_save_auto 0
vbsp_emit 1
vbsp_smokevol 1
vbsp_smokevol_pvs 0
vbsp_smokevol_cache 0
wait 3
echo P1830_REFERENCE
smokevol_info full
vbsp_smokevol_cache 1
wait 3
echo P1830_CACHE
smokevol_info full
vbsp_smokevol_pvs 1
wait 3
echo P1830_PVS
smokevol_info full
// Both defaults remain enabled. Move/look away and re-enter, then repeat info.

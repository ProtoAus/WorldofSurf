// Requires a VISIBLE eligible static prop with a valid lighting reference.
// authored/resolved counts alone are NOT an acted test: bound must be positive,
// and accepted submissions must increase on a new engine with the feature on.
// Capture a fixed-view off/on pair; check pose, tint, hiding and fallback too.
cfg_save_auto 0
vbsp_lightingorigin 0
wait 3
echo P1832_REFERENCE
lightingorigin_info
vbsp_lightingorigin 1
wait 3
echo P1832_ENABLED
lightingorigin_info
// Default remains on. Old engines must keep ordinary rendering and warn once.
// On a new engine also test video restart, map reload and r_drawentities 0/1.
